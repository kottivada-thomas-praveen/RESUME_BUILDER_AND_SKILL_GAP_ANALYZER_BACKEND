spring.application.name=RG_SGA
server.port=${PORT:8080}

# Flyway Database Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# Database Configuration (NeonDB Cloud Postgres by default, with local env override support)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://ep-wandering-shape-ap3ca2i6-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:neondb_owner}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:npg_OYFo4Enq7jPN}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
application.security.jwt.expiration=${JWT_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

# Google Gemini AI Integration
application.security.gemini.api-key=${GEMINI_API_KEY:}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://resume-builder-and-skill-gap-analyz.vercel.app}

# OAuth Credentials
github.client.id=${GITHUB_CLIENT_ID:your_github_client_id_here}
github.client.secret=${GITHUB_CLIENT_SECRET:your_github_client_secret_here}

# OpenAPI & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html