spring.application.name=RG_SGA
server.port=${PORT:8080}

# Flyway Database Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# Database Configuration (Defaults to local PostgreSQL, override with SPRING_DATASOURCE_URL for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sga_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:thomas_psql7@}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
# Increased minimum-idle from 2 to 5 to ensure warm connections are always available.
# Cloud databases (NeonDB) have ~1-3s connection setup cost on cold connections.
# keepaliveTime ensures idle connections stay warm and don't get dropped by the cloud firewall.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate Configuration
# Changed ddl-auto from "update" to "validate" so Hibernate does NOT diff and patch the schema on every startup.
# Flyway manages schema migrations explicitly. "update" was causing extra startup latency (1-3s) on each boot.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

# Admin Provisioning Configuration
admin.provision.email=${ADMIN_PROVISION_EMAIL:admin@rbsga.com}
admin.provision.password=${ADMIN_PROVISION_PASSWORD:Admin@RBSGA2026!}
admin.provision.name=${ADMIN_PROVISION_NAME:System Administrator}

# Google Gemini AI Integration
application.security.gemini.api-key=${GEMINI_API_KEY:}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://resume-builder-and-skill-gap-analyz.vercel.app,https://resume-builder-and-skill-gap-analyzer-dtqz.onrender.com}

# OAuth Credentials
github.client.id=${GITHUB_CLIENT_ID:your_github_client_id_here}
github.client.secret=${GITHUB_CLIENT_SECRET:your_github_client_secret_here}

# OpenAPI & Swagger UI
